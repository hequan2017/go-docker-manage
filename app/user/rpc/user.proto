syntax = "proto3";

package user;

option go_package = "github.com/hequan2017/go-docker-manage/app/user/rpc/pb;pb";

message RegisterReq {
  string username = 1;
  string password = 2;
  string nickname = 3;
}

message RegisterReply {
  int64 user_id = 1;
}

message LoginReq {
  string username = 1;
  string password = 2;
}

message LoginReply {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
}

message UserInfoReq {
  int64 user_id = 1;
}

message UserInfoReply {
  int64 user_id = 1;
  string username = 2;
  string nickname = 3;
  string created_at = 4;
}

service User {
  rpc Register(RegisterReq) returns (RegisterReply);
  rpc Login(LoginReq) returns (LoginReply);
  rpc UserInfo(UserInfoReq) returns (UserInfoReply);
}
