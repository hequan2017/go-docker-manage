<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="800" viewBox="0 0 1160 800" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .sub   { font-size: 12px; fill: #475569; }
      .label { font-size: 12px; fill: #334155; }
      .tag   { font-size: 12px; font-weight: 600; }
      .line  { stroke: #475569; stroke-width: 1.6; fill: none; }
      .nacos-line { stroke: #7c3aed; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1160" height="800" rx="16" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">go-docker-manage 架构</text>
  <text x="40" y="66" class="sub">go-zero 微服务 + Nacos · 通过 Docker SDK 对接 Docker Engine API</text>

  <!-- 接入层 -->
  <rect x="370" y="88" width="200" height="44" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="470" y="115" text-anchor="middle" class="title">浏览器</text>

  <line x1="470" y1="132" x2="470" y2="168" class="line" marker-end="url(#arrow)"/>
  <text x="480" y="155" class="label">HTTP</text>

  <rect x="335" y="170" width="270" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="470" y="196" text-anchor="middle" class="title" fill="#64748b">web（规划中）</text>
  <text x="470" y="217" text-anchor="middle" class="sub">nginx + Vue3 + Element Plus · :80</text>

  <line x1="470" y1="232" x2="470" y2="270" class="line" marker-end="url(#arrow)"/>
  <text x="480" y="256" class="label">/api 代理</text>

  <!-- 网关层 -->
  <rect x="295" y="272" width="350" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="470" y="301" text-anchor="middle" class="title">gateway :8888</text>
  <text x="470" y="323" text-anchor="middle" class="sub">go-zero REST · JWT 鉴权 · gRPC 错误 → {code, msg}</text>

  <!-- gRPC 总线 -->
  <line x1="470" y1="344" x2="470" y2="395" class="line"/>
  <line x1="125" y1="395" x2="795" y2="395" class="line"/>
  <line x1="125" y1="395" x2="125" y2="438" class="line" marker-end="url(#arrow)"/>
  <line x1="345" y1="395" x2="345" y2="438" class="line" marker-end="url(#arrow)"/>
  <line x1="605" y1="395" x2="605" y2="438" class="line" marker-end="url(#arrow)"/>
  <line x1="795" y1="395" x2="795" y2="438" class="line" marker-end="url(#arrow)"/>
  <rect x="478" y="356" width="214" height="22" rx="4" fill="#ffffff"/>
  <text x="484" y="372" class="label">gRPC（直连 或 nacos:// 服务发现）</text>

  <!-- 服务层 -->
  <rect x="40" y="440" width="170" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="125" y="468" text-anchor="middle" class="title">user-rpc :9000</text>
  <text x="125" y="490" text-anchor="middle" class="sub">注册 / 登录 / 用户信息</text>
  <text x="125" y="506" text-anchor="middle" class="sub">bcrypt 密码</text>

  <rect x="250" y="440" width="190" height="76" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="345" y="468" text-anchor="middle" class="title">node-rpc :9001</text>
  <text x="345" y="490" text-anchor="middle" class="sub">节点 CRUD / 健康检查</text>
  <text x="345" y="506" text-anchor="middle" class="sub">保存节点 Docker API 地址</text>

  <rect x="500" y="420" width="400" height="112" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="614" y="434" font-size="11" fill="#15803d">无状态 · 实时查询 Docker</text>

  <rect x="515" y="440" width="180" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="605" y="466" text-anchor="middle" class="title">container-rpc :9002</text>
  <text x="605" y="488" text-anchor="middle" class="sub">列表 / 启停 / 重启 / 删除</text>
  <text x="605" y="506" text-anchor="middle" class="sub">创建 / 日志 / stats</text>

  <rect x="705" y="440" width="180" height="80" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="795" y="466" text-anchor="middle" class="title">image-rpc :9003</text>
  <text x="795" y="488" text-anchor="middle" class="sub">列表 / 拉取 / 删除</text>

  <!-- container/image → node：查节点地址 -->
  <line x1="500" y1="478" x2="442" y2="478" class="line" marker-end="url(#arrow)"/>
  <text x="471" y="470" text-anchor="middle" font-size="11" fill="#334155">GetNode</text>
  <text x="471" y="494" text-anchor="middle" font-size="10" fill="#64748b">查地址</text>

  <!-- 数据层 -->
  <line x1="125" y1="516" x2="125" y2="598" class="line"/>
  <path d="M75,608 a50,10 0 0,0 100,0 a50,10 0 0,0 -100,0 v46 a50,10 0 0,0 100,0 v-46" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="125" y="640" text-anchor="middle" class="tag" fill="#92400e">SQLite</text>
  <text x="125" y="657" text-anchor="middle" class="sub">user.db</text>

  <line x1="345" y1="516" x2="345" y2="598" class="line"/>
  <path d="M295,608 a50,10 0 0,0 100,0 a50,10 0 0,0 -100,0 v46 a50,10 0 0,0 100,0 v-46" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text x="345" y="640" text-anchor="middle" class="tag" fill="#92400e">SQLite</text>
  <text x="345" y="657" text-anchor="middle" class="sub">node.db</text>

  <!-- container/image → Docker -->
  <line x1="700" y1="532" x2="700" y2="588" class="line" marker-end="url(#arrow)"/>
  <rect x="708" y="548" width="140" height="20" rx="4" fill="#ffffff"/>
  <text x="712" y="563" class="label">Docker SDK（按地址缓存）</text>

  <rect x="500" y="590" width="400" height="116" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="512" y="610" class="tag" fill="#075985">Docker Engine API（tcp://host:2375）</text>

  <rect x="515" y="622" width="180" height="70" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
  <text x="605" y="650" text-anchor="middle" class="title">mock-dockerd :2375</text>
  <text x="605" y="672" text-anchor="middle" class="sub">Docker API 模拟器（开发用）</text>

  <rect x="705" y="622" width="180" height="70" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="795" y="650" text-anchor="middle" class="title" fill="#64748b">真实 dockerd</text>
  <text x="795" y="672" text-anchor="middle" class="sub">改节点地址即可切换</text>

  <!-- node → mock-dockerd：健康检查 -->
  <path d="M420,516 V548 H470 V657 H513" class="line" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
  <text x="464" y="580" text-anchor="end" font-size="11" fill="#334155">GET /_ping</text>
  <text x="464" y="595" text-anchor="end" font-size="11" fill="#334155">健康检查</text>

  <!-- Nacos -->
  <rect x="950" y="272" width="170" height="260" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="1035" y="302" text-anchor="middle" class="title">Nacos :8848</text>
  <text x="1035" y="330" text-anchor="middle" class="tag" fill="#6d28d9">注册中心</text>
  <text x="1035" y="350" text-anchor="middle" class="sub">rpc 服务启动时注册</text>
  <text x="1035" y="368" text-anchor="middle" class="sub">客户端 nacos://服务名</text>
  <text x="1035" y="400" text-anchor="middle" class="tag" fill="#6d28d9">配置中心</text>
  <text x="1035" y="420" text-anchor="middle" class="sub">dataId = 服务名</text>
  <text x="1035" y="438" text-anchor="middle" class="sub">启动时覆盖本地配置</text>
  <line x1="970" y1="458" x2="1100" y2="458" stroke="#ddd6fe" stroke-width="1"/>
  <text x="1035" y="482" text-anchor="middle" font-size="11" fill="#64748b">Nacos.Host 为空时不启用，</text>
  <text x="1035" y="499" text-anchor="middle" font-size="11" fill="#64748b">服务之间按 Endpoints 直连</text>

  <line x1="645" y1="308" x2="948" y2="308" class="nacos-line" marker-end="url(#arrow-purple)"/>
  <text x="796" y="300" text-anchor="middle" font-size="11" fill="#6d28d9">服务发现 · 拉取配置</text>
  <line x1="900" y1="478" x2="948" y2="478" class="nacos-line" marker-end="url(#arrow-purple)"/>
  <text x="924" y="470" text-anchor="middle" font-size="10" fill="#6d28d9">注册</text>

  <!-- 图例 -->
  <line x1="40" y1="736" x2="1120" y2="736" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="754" width="28" height="18" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="76" y="768" class="label">已实现</text>
  <rect x="140" y="754" width="28" height="18" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="176" y="768" class="label">规划中 / 可替换</text>
  <line x1="300" y1="763" x2="336" y2="763" class="line" marker-end="url(#arrow)"/>
  <text x="344" y="768" class="label">调用</text>
  <line x1="400" y1="763" x2="436" y2="763" class="nacos-line" marker-end="url(#arrow-purple)"/>
  <text x="444" y="768" class="label">Nacos 注册 / 发现 / 配置（所有 rpc 服务与 gateway）</text>
</svg>
